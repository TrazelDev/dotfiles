theme = "catppuccin_macchiato"

[editor]
rulers = [100]
line-number = "relative"
bufferline = "multiple"
lsp.display-inlay-hints = true

# Making so in insert mode there is a regular cursor
[editor.cursor-shape]
insert = "bar"


# Making it so spaces will be shown as dots and tabs as arrows
[editor.whitespace]
render = { space = "all", tab = "all", newline = "none" }
[editor.whitespace.characters]
space = "·"
tab = "→"


[keys.normal]
C-e = [
  ':sh rm -f /tmp/unique-file720890',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file720890',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file720890}',
  ':redraw',
]
# esc = ["collapse_selection", "keep_primary_selection"]
